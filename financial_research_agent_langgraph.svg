<svg width="100%" viewBox="0 0 760 1240" role="img" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', system-ui, sans-serif">
  <title>MarketMind AI — LangGraph Workflow</title>
  <desc>LangGraph workflow for MarketMind AI: Gradio UI, Supervisor with conditional routing, stock/news/trade sub-flows, a prebuilt ToolNode with human-in-the-loop approval, SQLite checkpointed memory, and the final response back to Gradio.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="1240" fill="#0f1117"/>
  <text x="32" y="40" fill="#e6e6e6" font-size="20" font-weight="600">MarketMind AI — LangGraph Workflow</text>
  <text x="32" y="62" fill="#9c9a92" font-size="13">User → Gradio → Supervisor (conditional routing) → flows + ToolNode → SQLite memory → response</text>

  <!-- ── GRADIO LAYER ───────────────────────────────────────────── -->
  <rect x="200" y="84" width="420" height="60" rx="10" fill="#0a2a22" stroke="#5dcaa5"/>
  <text x="410" y="110" text-anchor="middle" fill="#9fe1cb" font-size="14" font-weight="600">Gradio UI</text>
  <text x="410" y="129" text-anchor="middle" fill="#5dcaa5" font-size="12">chat · conversation threads · approval panel · agent-activity panel</text>

  <!-- USER -->
  <rect x="40" y="84" width="120" height="60" rx="10" fill="#3c3489" stroke="#afa9ec"/>
  <text x="100" y="118" text-anchor="middle" fill="#cecbf6" font-size="14" font-weight="600">User</text>
  <line x1="160" y1="114" x2="200" y2="114" marker-end="url(#arrow)" stroke="#9c9a92" stroke-width="1.5"/>

  <!-- START -->
  <line x1="410" y1="144" x2="410" y2="176" marker-end="url(#arrow)" stroke="#9c9a92" stroke-width="1.5"/>
  <rect x="350" y="176" width="120" height="38" rx="19" fill="#444441" stroke="#b4b2a9"/>
  <text x="410" y="200" text-anchor="middle" fill="#d3d1c7" font-size="14" font-weight="600">START</text>

  <!-- ── AGENT STATE (left sidebar) ─────────────────────────────── -->
  <rect x="32" y="232" width="150" height="360" rx="10" fill="none" stroke="#4a4a47" stroke-dasharray="4 3"/>
  <text x="107" y="252" text-anchor="middle" fill="#9c9a92" font-size="11">AgentState (TypedDict)</text>
  <text x="107" y="276" text-anchor="middle" fill="#c2c0b6" font-size="12">messages</text>
  <text x="107" y="296" text-anchor="middle" fill="#c2c0b6" font-size="12">trade_messages</text>
  <text x="107" y="316" text-anchor="middle" fill="#c2c0b6" font-size="12">query · routes</text>
  <text x="107" y="336" text-anchor="middle" fill="#c2c0b6" font-size="12">ticker · quantity</text>
  <text x="107" y="356" text-anchor="middle" fill="#c2c0b6" font-size="12">stock_data</text>
  <text x="107" y="376" text-anchor="middle" fill="#c2c0b6" font-size="12">risk_score</text>
  <text x="107" y="396" text-anchor="middle" fill="#c2c0b6" font-size="12">news_results</text>
  <text x="107" y="416" text-anchor="middle" fill="#c2c0b6" font-size="12">purchase</text>
  <text x="107" y="436" text-anchor="middle" fill="#c2c0b6" font-size="12">aggregated</text>
  <text x="107" y="456" text-anchor="middle" fill="#c2c0b6" font-size="12">tool_history</text>
  <text x="107" y="476" text-anchor="middle" fill="#c2c0b6" font-size="12">final_response</text>
  <text x="107" y="496" text-anchor="middle" fill="#c2c0b6" font-size="12">needs_approval</text>
  <text x="107" y="540" text-anchor="middle" fill="#9c9a92" font-size="11">shared by every node;</text>
  <text x="107" y="556" text-anchor="middle" fill="#9c9a92" font-size="11">checkpointed to SQLite</text>
  <text x="107" y="572" text-anchor="middle" fill="#9c9a92" font-size="11">after every step</text>

  <!-- ── SUPERVISOR ─────────────────────────────────────────────── -->
  <line x1="410" y1="214" x2="410" y2="240" marker-end="url(#arrow)" stroke="#9c9a92" stroke-width="1.5"/>
  <rect x="290" y="240" width="240" height="56" rx="8" fill="#3c3489" stroke="#afa9ec"/>
  <text x="410" y="262" text-anchor="middle" fill="#cecbf6" font-size="14" font-weight="600">Supervisor agent</text>
  <text x="410" y="280" text-anchor="middle" fill="#afa9ec" font-size="12">LLM: intent → routes + ticker/quantity</text>

  <!-- ── ROUTER (conditional) ───────────────────────────────────── -->
  <line x1="410" y1="296" x2="410" y2="324" marker-end="url(#arrow)" stroke="#9c9a92" stroke-width="1.5"/>
  <polygon points="410,322 466,356 410,390 354,356" fill="#633806" stroke="#ef9f27"/>
  <text x="410" y="352" text-anchor="middle" fill="#fac775" font-size="13" font-weight="600">Route?</text>
  <text x="410" y="368" text-anchor="middle" fill="#fac775" font-size="10">conditional_edges</text>

  <!-- branch labels / lines -->
  <!-- stocks (left) -->
  <path d="M354 356 L160 356 L160 420" fill="none" stroke="#c2c0b6" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="235" y="348" text-anchor="middle" fill="#c2c0b6" font-size="10">"stocks"</text>
  <!-- news (center) -->
  <path d="M410 390 L410 420" fill="none" stroke="#c2c0b6" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="430" y="410" text-anchor="start" fill="#c2c0b6" font-size="10">"news"</text>
  <!-- buy (right) -->
  <path d="M466 356 L620 356 L620 420" fill="none" stroke="#c2c0b6" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="560" y="348" text-anchor="middle" fill="#c2c0b6" font-size="10">"buy"</text>
  <!-- chat skip (dashed straight to synthesizer) -->
  <path d="M354 372 L250 372 L250 880 L290 880" fill="none" stroke="#6b6b66" stroke-width="1" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="252" y="640" text-anchor="middle" fill="#9c9a92" font-size="10" transform="rotate(-90 252 640)">"chat" — skip all tools</text>

  <!-- ── STOCK FLOW ─────────────────────────────────────────────── -->
  <rect x="76" y="420" width="168" height="58" rx="8" fill="#0c447c" stroke="#85b7eb"/>
  <text x="160" y="443" text-anchor="middle" fill="#b5d4f4" font-size="14" font-weight="600">stock_fetcher</text>
  <text x="160" y="461" text-anchor="middle" fill="#85b7eb" font-size="11">Alpha Vantage / Yahoo · FX</text>
  <line x1="160" y1="478" x2="160" y2="506" marker-end="url(#arrow)" stroke="#c2c0b6" stroke-width="1"/>
  <rect x="76" y="506" width="168" height="58" rx="8" fill="#712b13" stroke="#f0997b"/>
  <text x="160" y="529" text-anchor="middle" fill="#f5c4b3" font-size="14" font-weight="600">risk_calculator</text>
  <text x="160" y="547" text-anchor="middle" fill="#f0997b" font-size="11">custom: vol · Sharpe · drawdown</text>

  <!-- ── NEWS FLOW ──────────────────────────────────────────────── -->
  <rect x="326" y="420" width="168" height="58" rx="8" fill="#0c447c" stroke="#85b7eb"/>
  <text x="410" y="443" text-anchor="middle" fill="#b5d4f4" font-size="14" font-weight="600">news_agent</text>
  <text x="410" y="461" text-anchor="middle" fill="#85b7eb" font-size="11">DuckDuckGo + sentiment</text>

  <!-- ── BUY FLOW (agent → ToolNode → collect) ──────────────────── -->
  <rect x="536" y="420" width="168" height="58" rx="8" fill="#3c3489" stroke="#afa9ec"/>
  <text x="620" y="443" text-anchor="middle" fill="#cecbf6" font-size="14" font-weight="600">trader</text>
  <text x="620" y="461" text-anchor="middle" fill="#afa9ec" font-size="11">emits purchase_stock call</text>
  <line x1="620" y1="478" x2="620" y2="506" marker-end="url(#arrow)" stroke="#c2c0b6" stroke-width="1"/>
  <rect x="536" y="506" width="168" height="58" rx="8" fill="#0a2a22" stroke="#5dcaa5"/>
  <text x="620" y="525" text-anchor="middle" fill="#9fe1cb" font-size="14" font-weight="600">trade_tools</text>
  <text x="620" y="540" text-anchor="middle" fill="#5dcaa5" font-size="11">prebuilt ToolNode</text>
  <text x="620" y="555" text-anchor="middle" fill="#fac775" font-size="11">⏸ interrupt → human approval</text>
  <line x1="620" y1="564" x2="620" y2="592" marker-end="url(#arrow)" stroke="#c2c0b6" stroke-width="1"/>
  <rect x="536" y="592" width="168" height="50" rx="8" fill="#444441" stroke="#b4b2a9"/>
  <text x="620" y="613" text-anchor="middle" fill="#d3d1c7" font-size="14" font-weight="600">trade_collect</text>
  <text x="620" y="630" text-anchor="middle" fill="#b4b2a9" font-size="11">ToolMessage → state</text>

  <!-- converge to processing -->
  <path d="M160 564 L160 700 L290 700" fill="none" stroke="#c2c0b6" stroke-width="1" marker-end="url(#arrow)"/>
  <path d="M410 478 L410 700" fill="none" stroke="#c2c0b6" stroke-width="1" marker-end="url(#arrow)"/>
  <path d="M620 642 L620 700 L530 700" fill="none" stroke="#c2c0b6" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- ── PROCESSING → STATE UPDATER ─────────────────────────────── -->
  <rect x="290" y="672" width="240" height="56" rx="8" fill="#444441" stroke="#b4b2a9"/>
  <text x="410" y="694" text-anchor="middle" fill="#d3d1c7" font-size="14" font-weight="600">processing → state_updater</text>
  <text x="410" y="712" text-anchor="middle" fill="#b4b2a9" font-size="11">aggregate outputs · dedupe tool_history</text>

  <!-- ── RESPONSE SYNTHESIZER ───────────────────────────────────── -->
  <line x1="410" y1="728" x2="410" y2="852" marker-end="url(#arrow)" stroke="#9c9a92" stroke-width="1.5"/>
  <rect x="290" y="852" width="240" height="56" rx="8" fill="#3c3489" stroke="#afa9ec"/>
  <text x="410" y="874" text-anchor="middle" fill="#cecbf6" font-size="14" font-weight="600">response_synthesizer</text>
  <text x="410" y="892" text-anchor="middle" fill="#afa9ec" font-size="11">LLM answer (template fallback offline)</text>

  <!-- ── APPROVAL GATE ──────────────────────────────────────────── -->
  <line x1="410" y1="908" x2="410" y2="936" marker-end="url(#arrow)" stroke="#9c9a92" stroke-width="1.5"/>
  <rect x="290" y="936" width="240" height="54" rx="8" fill="#633806" stroke="#ef9f27"/>
  <text x="410" y="957" text-anchor="middle" fill="#fac775" font-size="14" font-weight="600">approval_gate</text>
  <text x="410" y="974" text-anchor="middle" fill="#ef9f27" font-size="11">approve → END · revise → re-synthesize</text>
  <!-- revise loop -->
  <path d="M290 950 L230 950 L230 880 L290 880" fill="none" stroke="#ef9f27" stroke-width="0.9" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="214" y="916" text-anchor="middle" fill="#854f0b" font-size="10">revise</text>

  <!-- ── MEMORY LAYER ───────────────────────────────────────────── -->
  <rect x="32" y="1018" width="696" height="70" rx="10" fill="none" stroke="#4a4a47" stroke-dasharray="5 3"/>
  <text x="48" y="1038" fill="#9c9a92" font-size="11">Memory &amp; observability layer (persists every super-step)</text>
  <rect x="52" y="1044" width="200" height="34" rx="8" fill="#27500a" stroke="#97c459"/>
  <text x="152" y="1066" text-anchor="middle" fill="#c0dd97" font-size="13" font-weight="600">SqliteSaver checkpointer</text>
  <rect x="280" y="1044" width="200" height="34" rx="8" fill="#27500a" stroke="#97c459"/>
  <text x="380" y="1066" text-anchor="middle" fill="#c0dd97" font-size="13" font-weight="600">thread memory (thread_id)</text>
  <rect x="508" y="1044" width="200" height="34" rx="8" fill="#27500a" stroke="#97c459"/>
  <text x="608" y="1066" text-anchor="middle" fill="#c0dd97" font-size="13" font-weight="600">LangSmith tracing</text>

  <!-- ── END ────────────────────────────────────────────────────── -->
  <line x1="410" y1="990" x2="410" y2="1018" marker-end="url(#arrow)" stroke="#9c9a92" stroke-width="1.5"/>
  <!-- back to gradio -->
  <path d="M530 963 L700 963 L700 114 L620 114" fill="none" stroke="#6b6b66" stroke-width="0.9" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="712" y="540" text-anchor="middle" fill="#9c9a92" font-size="10" transform="rotate(-90 712 540)">final response → Gradio</text>

  <!-- ── LEGEND ─────────────────────────────────────────────────── -->
  <rect x="32" y="1108" width="696" height="104" rx="8" fill="none" stroke="#3a3a37"/>
  <text x="48" y="1128" fill="#9c9a92" font-size="11">Legend</text>
  <rect x="48" y="1138" width="14" height="14" rx="3" fill="#3c3489" stroke="#afa9ec"/>
  <text x="70" y="1150" fill="#c2c0b6" font-size="12">LLM agent nodes</text>
  <rect x="48" y="1160" width="14" height="14" rx="3" fill="#0c447c" stroke="#85b7eb"/>
  <text x="70" y="1172" fill="#c2c0b6" font-size="12">External-API tools</text>
  <rect x="48" y="1182" width="14" height="14" rx="3" fill="#0a2a22" stroke="#5dcaa5"/>
  <text x="70" y="1194" fill="#c2c0b6" font-size="12">Prebuilt ToolNode</text>
  <rect x="300" y="1138" width="14" height="14" rx="3" fill="#712b13" stroke="#f0997b"/>
  <text x="322" y="1150" fill="#c2c0b6" font-size="12">Custom Python tool</text>
  <rect x="300" y="1160" width="14" height="14" rx="3" fill="#27500a" stroke="#97c459"/>
  <text x="322" y="1172" fill="#c2c0b6" font-size="12">Memory / persistence</text>
  <rect x="300" y="1182" width="14" height="14" rx="3" fill="#633806" stroke="#ef9f27"/>
  <text x="322" y="1194" fill="#c2c0b6" font-size="12">Conditional routing / HITL</text>
  <rect x="540" y="1138" width="14" height="14" rx="3" fill="#444441" stroke="#b4b2a9"/>
  <text x="562" y="1150" fill="#c2c0b6" font-size="12">Processing / control</text>
  <line x1="540" y1="1167" x2="560" y2="1167" stroke="#6b6b66" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="566" y="1172" fill="#c2c0b6" font-size="12">skip / loop edge</text>
</svg>
